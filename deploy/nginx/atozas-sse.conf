# ─────────────────────────────────────────────────────────────
# ATOZAS AI — Nginx location blocks
#
# CloudPanel owns the server{} block, the SSL certificate lines and its own
# template placeholders. Do NOT paste a server{} block over them.
#
# Install:
#   1. Save this file as /etc/nginx/snippets/atozas-sse.conf
#   2. In the CloudPanel vhost, inside the existing server{} block for
#      www.atozasai.com, add:  include /etc/nginx/snippets/atozas-sse.conf;
#      Place it ABOVE any generic "location /" so the more specific prefixes win.
#   3. nginx -t && systemctl reload nginx
#
# Everything CloudPanel generated — {{ssl_certificate}}, {{root}}, listen
# directives, Let's Encrypt ACME locations — stays untouched.
# ─────────────────────────────────────────────────────────────

# ── Streaming chat (Server-Sent Events) ──
# Buffering is the single most common cause of "the answer appears all at once
# after a long freeze". Every directive below exists to defeat a layer of it.
location ~ ^/api/v1/conversations/[^/]+/stream {
    proxy_pass http://127.0.0.1:5000;

    # SSE requires HTTP/1.1; the default 1.0 to upstream breaks chunked streaming.
    proxy_http_version 1.1;
    proxy_set_header Connection '';

    proxy_buffering off;
    proxy_cache off;
    gzip off;

    # CPU prefill on a 4B model can take 30s+ before the first token, and a
    # long answer can run for minutes. These must exceed the worst-case
    # generation time or Nginx will sever the stream mid-answer.
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_connect_timeout 15s;

    # Belt and braces: the app also sets this header itself.
    add_header X-Accel-Buffering no always;
    chunked_transfer_encoding on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
}

# ── Health probes ──
# Excluded from the access log; uptime monitors would otherwise dominate it.
location /api/health {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# ── Regular JSON API ──
location /api/ {
    proxy_pass http://127.0.0.1:5000;

    proxy_http_version 1.1;
    proxy_set_header Connection '';

    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 15s;

    # Matches JSON_BODY_LIMIT plus headroom for document ingestion.
    client_max_body_size 4m;
    client_body_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
}

# ── Socket.IO ──
location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

